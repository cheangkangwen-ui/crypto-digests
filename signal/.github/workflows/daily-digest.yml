name: Crypto Signal Digest

on:
  schedule:
    # 00:00 UTC = 08:00 SGT
    - cron: '0 0 * * *'
  workflow_dispatch:
    # one-click manual trigger from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADE_IDEAS_CHAT_ID: ${{ secrets.TRADE_IDEAS_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: python -u read_crypto_signals.py
