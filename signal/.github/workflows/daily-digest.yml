name: Crypto Signal Digest

on:
  # Schedule disabled — GitHub Actions free-tier private-repo schedules are unreliable
  # (delays of hours, skipped days). Triggered instead by Perplexity cron c8e64e69 at 00:00 UTC.
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:
    # one-click manual trigger from the Actions tab + Perplexity cron API trigger

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          PYTHONUNBUFFERED: '1'
        run: python -u read_crypto_signals.py
