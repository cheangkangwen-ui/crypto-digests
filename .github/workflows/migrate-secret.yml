name: Migrate secret
on: workflow_dispatch
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt session secret
        env:
          SESSION: ${{ secrets.TELEGRAM_SESSION_GHA }}
          MKEY: ${{ secrets.MIGRATE_KEY }}
        run: printf '%s' "$SESSION" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:MKEY -out session.enc
      - uses: actions/upload-artifact@v4
        with:
          name: session-enc
          path: session.enc
          retention-days: 1
